<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – Inclusive UniTime</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:1.2rem}
.login{width:min(480px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:2rem;box-shadow:var(--sh)}
.login .logo{display:flex;align-items:center;gap:.8rem;margin-bottom:.4rem}
.login .logo svg{width:48px;height:48px}
.login h1{margin:0;font-size:1.6rem;color:var(--navy);letter-spacing:-.02em;line-height:1.1}
.login h1 small{display:block;font-size:.85rem;font-weight:400;color:var(--muted);letter-spacing:0}
fieldset{border:0;margin:0 0 1.2rem;padding:0}
legend{font-weight:700;color:var(--navy);margin-bottom:.6rem;padding:0}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.role{position:relative;display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center;padding:1.2rem .8rem;border:2px solid var(--line);border-radius:18px;background:var(--card);cursor:pointer;color:var(--navy);transition:border-color .15s,background .15s,transform .15s}
.role:hover{border-color:var(--blue);transform:translateY(-2px)}
.role input{position:absolute;opacity:0;inset:0;cursor:pointer}
.role small{font-weight:400;color:var(--muted);font-size:.82rem}
.role:has(input:checked){border-color:var(--blue);background:var(--sky);box-shadow:0 0 0 3px rgba(47,107,216,.25)}
.role:has(input:focus-visible){outline:3px solid var(--amber);outline-offset:3px}
.role:has(input:checked)::after{content:"✓";position:absolute;top:.5rem;right:.7rem;font-weight:700;color:var(--blue)}
.login .btn{width:100%;margin-top:1.2rem;padding:.85rem;font-size:1.05rem}
.note{font-size:.82rem;color:var(--muted);margin:1.1rem 0 0;text-align:center}
.err{margin-top:.8rem}
</style>
</head>
<body>
<main class="login">
  <div class="logo">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#ffb000"/><path d="M20 9 6 16l14 7 14-7z" fill="#14284b"/><path d="M11 20v6c0 2 4 4 9 4s9-2 9-4v-6l-9 4.5z" fill="#14284b"/></svg>
    <h1>Inclusive UniTime<small>Plan, access, belong</small></h1>
  </div>
  <p class="sub" style="margin:1rem 0 1.4rem">Welcome. Tell us who you are to get started.</p>
  <form id="f" novalidate>
    <fieldset>
      <legend>I am a…</legend>
      <div class="roles">
        <label class="role"><input type="radio" name="role" value="student">
          <span class="ico"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5"/></svg></span>
          <b>Student</b><small>View my timetable</small></label>
        <label class="role"><input type="radio" name="role" value="staff">
          <span class="ico t"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></span>
          <b>Lecturer / Admin</b><small>Manage classes</small></label>
      </div>
    </fieldset>
    <label>Your name <span style="font-weight:400;color:var(--muted)">(optional)</span>
      <input id="name" autocomplete="name" placeholder="e.g. Alex" maxlength="40"></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" type="submit">Continue</button>
  </form>
  <p class="note">Demo sign-in: no password is needed and nothing leaves your device.</p>
</main>
<script>
const K="ut-user",root=document.documentElement,$=s=>document.querySelector(s);
try{const u=JSON.parse(localStorage.getItem(K));if(u&&u.role)location.replace("index.html")}catch(e){}
try{const s=JSON.parse(localStorage.getItem("ut")).s;root.dataset.theme=s.th;root.dataset.text=s.t;root.dataset.contrast=s.c;root.dataset.motion=s.m}catch(e){}
$("#f").onsubmit=e=>{e.preventDefault();
 const r=document.querySelector('input[name=role]:checked');
 if(!r){$("#err").textContent="Please choose Student or Lecturer / Admin to continue.";document.querySelector('input[name=role]').focus();return}
 const name=$("#name").value.trim()||(r.value==="staff"?"Dr Khan":"Alex");
 try{localStorage.setItem(K,JSON.stringify({role:r.value,name}))}catch(_){}
 location.href="index.html"};
document.querySelectorAll('input[name=role]').forEach(i=>i.onchange=()=>$("#err").textContent="");
</script>
</body>
</html>
